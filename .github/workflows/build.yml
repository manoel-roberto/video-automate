name: Build Desktop Applications (Linux & Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: VideoAutomate-linux
            binary_path: dist/VideoAutomate
            target_filename: VideoAutomate-linux
          - os: windows-latest
            artifact_name: VideoAutomate-windows
            binary_path: dist/VideoAutomate.exe
            target_filename: VideoAutomate.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Desktop Executable with PyInstaller
        run: |
          pyinstaller --clean video_automate.spec

      - name: Prepare Binary with Fixed Name
        shell: bash
        run: |
          mkdir -p dist_artifact
          cp ${{ matrix.binary_path }} dist_artifact/${{ matrix.target_filename }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist_artifact/${{ matrix.target_filename }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release (Version History)
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts

      - name: Prepare Release Assets & Version Info
        id: prep
        run: |
          mkdir -p release_assets
          # Encontra e copia os executáveis finais
          find downloaded_artifacts -type f -name "VideoAutomate.exe" -exec cp {} release_assets/ \;
          find downloaded_artifacts -type f -name "VideoAutomate-linux" -exec cp {} release_assets/ \;
          chmod +x release_assets/VideoAutomate-linux || true
          
          echo "=== Arquivos para o Release ==="
          ls -lh release_assets/
          
          # Define a tag e nome da versão para manter o histórico
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            REL_TITLE="Video Automate ${{ github.ref_name }}"
          else
            # Versão incremental por execução: v1.0.<run_number> para histórico completo
            TAG_NAME="v1.0.${{ github.run_number }}"
            REL_TITLE="Video Automate v1.0.${{ github.run_number }}"
          fi
          
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "REL_TITLE=${REL_TITLE}" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "COMMIT_MSG=$(git log -1 --pretty=%s)" >> $GITHUB_ENV

      - name: Publish Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << EOF > release_notes.md
          ## 🚀 Video Automate Desktop - Executáveis Prontos para Uso

          Builds automáticas e autocontidas geradas pelo GitHub Actions:

          * 🪟 **Windows (.exe)**: [Download VideoAutomate.exe](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/VideoAutomate.exe)
          * 🐧 **Linux (Executável)**: [Download VideoAutomate-linux](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/VideoAutomate-linux)

          ---
          ### 📦 Informações desta Versão:
          - **Tag / Versão**: \`${TAG_NAME}\`
          - **Commit**: \`${COMMIT_SHA}\` (${COMMIT_MSG})
          - **Compilado em**: $(date -u '+%d/%m/%Y às %H:%M:%S UTC')

          ---
          ### 📌 Instruções de Execução:

          #### No Windows:
          1. Baixe o arquivo **\`VideoAutomate.exe\`**.
          2. Dê duplo clique para abrir diretamente (não necessita instalar Python nem FFmpeg).

          #### No Linux:
          1. Baixe o arquivo **\`VideoAutomate-linux\`**.
          2. Conceda permissão de execução e execute:
             \`\`\`bash
             chmod +x VideoAutomate-linux
             ./VideoAutomate-linux
             \`\`\`
          EOF

          upload_success=0
          for attempt in 1 2 3; do
            echo "=== Tentativa $attempt de publicação da release ${TAG_NAME} ==="
            # Se a release já existir (ex: falha parcial anterior), remove antes de recriar
            if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
              echo "Limpando release/assets parciais de ${TAG_NAME}..."
              gh release delete "${TAG_NAME}" -y || true
            fi

            echo "Criando release ${TAG_NAME} e enviando executáveis de forma atômica..."
            if gh release create "${TAG_NAME}" \
                release_assets/VideoAutomate.exe \
                release_assets/VideoAutomate-linux \
                --title "${REL_TITLE}" \
                --notes-file release_notes.md; then
              echo "✅ Release ${TAG_NAME} criada e executáveis anexados com sucesso!"
              upload_success=1
              break
            else
              echo "Aviso: Tentativa $attempt falhou ao criar release ou enviar assets. Aguardando 15 segundos..."
              sleep 15
            fi
          done

          if [ $upload_success -ne 1 ]; then
            echo "Erro crítico: Falha ao publicar release após 3 tentativas."
            exit 1
          fi
